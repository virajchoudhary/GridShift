[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridshift"
version = "1.0.0"
description = "Reproducible NESO forecasting and deadline-constrained carbon-aware scheduling"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "statsmodels>=0.14.4,<0.15", "requests>=2.31,<3", "pyarrow>=16,<24",
  "matplotlib>=3.8,<4", "plotly>=5.22,<7", "streamlit>=1.40,<2",
  "PyYAML>=6,<7", "nbformat>=5.10,<6", "nbconvert>=7.16,<8",
  "ipykernel>=6.29,<7", "reportlab>=4,<5", "python-pptx>=1,<2",
  "pytest>=8,<10", "psutil>=5.9,<8",
]

[project.scripts]
gridshift = "gridshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridshift = ["*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning"]
